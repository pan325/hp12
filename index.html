        const levels = [

        ];
        let curLv = 0,
            passed = new Array(9).fill(false);

        function show(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

            window.scrollTo(0, 0);
        }

        function startGame() { show('scr-game');
            loadLevel(0); }

        function loadLevel(i) {
            curLv = i;
            const lv = levels[i];
            document.getElementById('lvTitle').innerHTML =
                `第 ${i+1} 关 · ${lv.name}<div style="font-size:14px;color:#d4af37;letter-spacing:3px;margin-top:6px;">${lv.sub}</div>`;
            const dots = document.getElementById('dots');
            dots.innerHTML = '';
            for (let k = 0; k < 9; k++) {
                const d = document.createElement('div');
                d.className = 'dot' + (k === i ? ' cur' : '') + (passed[k] ? ' done' : '');
                d.textContent = k + 1;
                d.onclick = () => { if (passed[k] || k <= i || confirm('尚未通关，确定要跳转吗？')) loadLevel(k); };
                dots.appendChild(d);
            }
            const body = document.getElementById('lvBody');
            body.innerHTML = '';
            lv.setup(body);
        }

        function passLevel(msg) {
            passed[curLv] = true;
            const body = document.getElementById('lvBody');
            const div = document.createElement('div');
            div.style.cssText = 'text-align:center;margin-top:24px;';
            div.innerHTML =
                `<div style="font-size:22px;color:#2c6e1f;font-weight:bold;">✔ ${msg||'通关！'}</div>
            <button class="btn" style="margin-top:18px;" id="nextBtn"></button>`;
            body.appendChild(div);
            const nb = document.getElementById('nextBtn');
            if (curLv < 8) { nb.textContent = '下一关 →';
                nb.onclick = () => loadLevel(curLv + 1); } else { nb.textContent = '观看纪念短片 →';
                nb.onclick = finish; }

        }

        function finish() { stopMusic();
            show('scr-end');
            const v = document.getElementById('memVideo');
            v.load();
            v.play().catch(() => {}); }

        function replay() { passed = new Array(9).fill(false);
            show('scr-game');
            loadLevel(0); }

        const norm = s => s.replace(/[\s，。！？、；：,.!?;:·“”"'（）()\s]/g, '');

        function poemCard(title, year, bg, textHtml) {
            return `<div class="card"><h3>${title} <span style="font-size:14px;color:#8a6d1f;">（${year}）</span></h3>
          <div class="bg-note"><b>创作背景</b>　${bg}</div>
          <div class="poetry">${textHtml}</div></div>`;
        }

        function renderLines(lines, stanzaBreak, rhymeSet) {
            let html = '<div class="poetry">';
            const total = lines.length;
            for (let i = 0; i < total; i++) {
                const line = lines[i];
                const isRhyme = rhymeSet && rhymeSet.has(i);
                html += `<span class="line-single${isRhyme?' rhyme':''}">${line}</span>`;
                if (stanzaBreak && i === stanzaBreak - 1) html += '<div class="stanza-gap"></div>';
            }
            html += '</div>';
            return html;
        }

                    fb.className = 'feedback bad';

        /* ---------- 第2关 沁园春·长沙 ---------- */
        function setupCsc(body) {
    const data = POEM.csc;
    const rhymeAnswers = data.rhymeAnswers;
    const allLines = data.lines;
    const sel = new Set();
    // 构建韵脚集合
    const ansSet = new Set();
    rhymeAnswers.forEach(a => {
        const idx = allLines.findIndex(l => norm(l) === norm(a));
        if (idx >= 0) ansSet.add(idx);
    });
    // "独立寒秋" 索引 0 可算可不算
    const optionalIdx = 0;

    // 第一个卡片：标题 + 背景（不再展示全词）
    let html = `<div class="card"><h3>${data.title} <span style="font-size:14px;color:#8a6d1f;">（${data.year}）</span></h3>
          <div class="bg-note"><b>创作背景</b>　${data.bg}</div>
          </div>
          <div class="card"><h3>本词押 <b>平声 </b><b>尤</b> 韵，请找到所有包含韵脚的句子</h3>
          <div style="font-size:14px;color:#8a6d1f;margin-bottom:10px;">点击句子选中（再点取消）。</div>`;
    // 逐句显示，每句一行
    allLines.forEach((ln, i) => {
        const isAns = ansSet.has(i);
        const isOpt = (i === optionalIdx);
        html +=
            `<div class="poetry clickable" data-i="${i}" data-ans="${isAns?1:0}" data-opt="${isOpt?1:0}" style="text-align:center;cursor:pointer;">${ln}</div>`;
    });
    html += `<div class="feedback" id="fb"></div></div>`;
    body.innerHTML = html;

    // 以下事件绑定保持不变
    body.querySelectorAll('.clickable').forEach(el => {
        el.onclick = () => {
            const i = +el.dataset.i;
            const isAns = el.dataset.ans === '1';
            const isOpt = el.dataset.opt === '1';
            if (sel.has(i)) {
                sel.delete(i);
                el.classList.remove('sel', 'right', 'wrongfl');
                document.getElementById('fb').className = 'feedback';
                document.getElementById('fb').textContent = '';
                return;
            }
            sel.add(i);
            if (isAns || isOpt) {
                el.classList.add('right');
                el.classList.remove('wrongfl');
                const allAnsSelected = [...ansSet].every(idx => sel.has(idx));
                const noWrong = [...sel].every(idx => ansSet.has(idx) || idx === optionalIdx);
                if (allAnsSelected && noWrong) {
                    document.getElementById('fb').className = 'feedback ok';
                    const extra = sel.has(optionalIdx) ? '（含“独立寒秋”）' : '（不含“独立寒秋”）';
                    document.getElementById('fb').textContent =
                        `韵脚全部找齐！${extra} 正确！`;
                    passLevel('《沁园春·长沙》通关');
                } else {
                    document.getElementById('fb').className = 'feedback';
                    document.getElementById('fb').textContent = '还差一些韵脚，继续找找看。';
                }
            } else {
                el.classList.add('wrongfl');
                document.getElementById('fb').className = 'feedback bad';
                document.getElementById('fb').textContent = '这个句子不押韵，再想想。';
                setTimeout(() => {
                    el.classList.remove('wrongfl');
                    sel.delete(i);
                    document.getElementById('fb').className = 'feedback';
                    document.getElementById('fb').textContent = '';
                }, 800);
            }
        };
    });
}

/* ---------- 第3关 七律·长征 ---------- */
function setupLong(body) {
    const data = POEM.long;
    const full = data.full;
    const scrambleIdx = data.scrambleIdx;
    const correctOrder = scrambleIdx.map(i => full[i]);
    let cur = [...correctOrder];
    // 随机打乱
    for (let i = cur.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cur[i], cur[j]] = [cur[j], cur[i]];
    }

    // 生成原诗展示（含占位横线）
    let html = `<div class="card"><h3>${data.title} <span style="font-size:14px;color:#8a6d1f;">（${data.year}）</span></h3>
          <div class="bg-note"><b>创作背景</b>　${data.bg}</div>
          <div class="poetry">`;
    for (let i = 0; i < full.length; i++) {
        if (i === 2) html += `<div class="stanza-gap-sm"></div>`;
        if (scrambleIdx.includes(i)) {
            // 显示横线占位，不显示诗句文字
            html += `<span class="line-single" style="color:#999;border-bottom:2px dashed #aaa;padding:0 10px;">______</span>`;
        } else {
            html += `<span class="line-single">${full[i]}</span>`;
        }
    }
    html += `</div>
          <div style="margin-top:12px;font-size:14px;color:#8a6d1f;text-align:center;">请将下面空缺的四句诗按正确顺序排列（使用上下按钮）</div>
          </div>
          <div class="card"><h3>调整诗句顺序</h3>
           <div id="ord"></div>
           <div class="feedback" id="fb"></div>
           <div style="text-align:center;"><button class="btn small ghost" id="hp" style="color:#7c0d11;border-color:#a11217;">给我提示</button></div>
          </div>`;

    body.innerHTML = html;

    function renderOrd() {
        const w = document.getElementById('ord');
        w.innerHTML = '';
        cur.forEach((ln, i) => {
            const d = document.createElement('div');
            const isCorrect = ln === correctOrder[i];
            d.className = 'orderline' + (isCorrect ? ' good' : ' scrambled');
            d.innerHTML = `<span><span class="badge">句${i+3}</span>${ln}</span><span>
                <button class="mvbtn" data-a="up" data-i="${i}">↑ 上移</button>
                <button class="mvbtn" data-a="dn" data-i="${i}">↓ 下移</button></span>`;
            w.appendChild(d);
        });
        w.querySelectorAll('.mvbtn').forEach(b => b.onclick = () => {
            const i = +b.dataset.i,
                j = b.dataset.a === 'up' ? i - 1 : i + 1;
            if (j < 0 || j > 3) return;
            [cur[i], cur[j]] = [cur[j], cur[i]];
            renderOrd();
            if (cur.every((v, k) => v === correctOrder[k])) {
                document.getElementById('fb').className = 'feedback ok';
                document.getElementById('fb').textContent = '顺序完全正确！“三军过后尽开颜”！';
                passLevel('《七律·长征》通关');
            }
        });
    }
    renderOrd();

    document.getElementById('hp').onclick = () => {
        for (let k = 0; k < 4; k++) {
            if (cur[k] !== correctOrder[k]) {
                document.getElementById('fb').className = 'feedback';
                document.getElementById('fb').innerHTML =
                    `第 ${k+3} 句位置应为：「${correctOrder[k].slice(0,4)}……」`;
                return;
            }
        }
        document.getElementById('fb').textContent = '顺序已全部正确！';
    };
}

                a: true
            }, {
                t: '两首词都写梅花，但毛泽东笔下的梅花是“俏也不争春”的报春使者，陆游笔下的梅花则是“寂寞开无主”的孤芳自赏，二者精神境界截然不同。',
                a: true
            }, {
                t: '毛泽东“反其意而用之”是指完全否定陆游词的所有内容，认为梅花不应该在寒冬开放。',
                a: false
            }];
            let html = `<div class="card"><h3>两首《卜算子 · 咏梅》对照</h3>
           <div class="bg-note">${data.bg}</div>
           <div class="twocol">
            <div><h3 style="font-size:18px;">毛泽东</h3><div class="poetry" style="font-size:17px;">${data.mao}</div></div>
            <div><h3 style="font-size:18px;color:#6b4e00;">陆游</h3><div class="poetry" style="font-size:17px;">${data.lu}</div></div>
           </div></div>
           <div class="card"><h3>判断以下赏析的正误（点“对”或“错”）</h3><div id="judge"></div>
           <div class="feedback" id="fb"></div></div>`;
            body.innerHTML = html;
            const done = new Set();
            const box = document.getElementById('judge');
            stmts.forEach((s, i) => {
                const d = document.createElement('div');
                d.style.cssText =
                'margin:14px 0;padding:12px;background:#fffdf6;border:2px solid #c8b58a;border-radius:8px;';
                d.innerHTML = `<p style="font-size:16px;line-height:1.9;">${i+1}. ${s.t}</p>
              <div style="text-align:right;margin-top:8px;"><button class="btn small" data-v="1">对 ✔</button>
              <button class="btn small ghost" data-v="0" style="color:#7c0d11;border-color:#a11217;margin-left:10px;">错 ✘</button>
              <span class="rs" style="margin-left:12px;font-weight:bold;"></span></div>`;
                box.appendChild(d);
                d.querySelectorAll('button').forEach(b => b.onclick = () => {
                    const pick = b.dataset.v === '1';
                    const rs = d.querySelector('.rs');
                    if (pick === s.a) {
                        rs.textContent = pick ? '✔ 判断正确' : '✘ 判断正确';
                        rs.style.color = '#2c6e1f';
                        done.add(i);
                        d.style.borderColor = '#3d8b2e';
                        d.style.background = '#eef7e8';
                        if (done.size === stmts.length) {
                            document.getElementById('fb').className = 'feedback ok';
                            document.getElementById('fb').textContent = '全部判断正确！毛泽东读陆游的咏梅词后，以完全相反的立意（陆游写梅孤寂自怜，毛泽东写梅昂扬报春）来创作自己的《卜算子·咏梅》。';
                            passLevel('《卜算子·咏梅》通关');
                        }
                    } else {
                        rs.textContent = '再想想';
                        rs.style.color = '#b01f24';
                    }
                });
            });
        }

        /* ---------- 第8关 七律·占领南京 ---------- */
        function setupNjg(body) {
            const data = POEM.njg;
            const left = ['虎踞龙盘', '慨而慷', '追穷寇', '霸王', '天若有情天亦老', '人间正道是沧桑'];
            const right = [
                { t: '诸葛亮论金陵地势：“钟山龙蟠，石头虎踞”，乃帝王之宅', k: 0 },
                { t: '曹操《短歌行》：“慨当以慷，忧思难忘”', k: 1 },
                { t: '反用《孙子兵法》“穷寇勿迫”——对垂死之敌须一追到底', k: 2 },
                { t: '西楚霸王项羽：鸿门宴放走刘邦，终自刎乌江，不可学其沽名', k: 3 },
                { t: '唐代李贺《金铜仙人辞汉歌》：“衰兰送客咸阳道，天若有情天亦老”', k: 4 },
                { t: '《神仙传》记载：女仙麻姑对另一仙人王方平说，他们相见以来，东海已经三次变为桑田。原指世事巨变，此指正道在于不断变革前进', k: 5 }
            ];
            right.sort(() => 0.5 - Math.random());
            let html = `<div class="card"><h3>${data.title} <span style="font-size:14px;color:#8a6d1f;">（${data.year}）</span></h3>
           <div class="bg-note">${data.bg}</div>
           <div class="poetry">${data.text}</div></div>
           <div class="card"><h3>典故匹配：左点词句，右点来历</h3>
           <div class="matchwrap"><div class="matchcol" id="mL"></div><div class="matchcol" id="mR"></div></div>
           <div class="feedback" id="fb"></div>
           <div style="text-align:center;"><button class="btn small ghost" id="hp" style="color:#7c0d11;border-color:#a11217;">给我提示</button></div></div>`;
            body.innerHTML = html;
            const done = new Set();
            let selL = null;
            const mL = document.getElementById('mL'),
                mR = document.getElementById('mR');
            left.forEach((t, i) => {
                const d = document.createElement('div');
                d.className = 'matchitem';
                d.dataset.k = i;
                d.textContent = t;
                d.onclick = () => {
                    if (done.has(i)) return;
                    mL.querySelectorAll('.matchitem').forEach(x => x.classList.remove('sel'));
                    d.classList.add('sel');
                    selL = i;
                };
                mL.appendChild(d);
            });
            right.forEach(r => {
                const d = document.createElement('div');
                d.className = 'matchitem';
                d.dataset.k = r.k;
                d.textContent = r.t;
                d.onclick = () => {
                    if (selL === null) {
                        document.getElementById('fb').className = 'feedback bad';
                        document.getElementById('fb').textContent = '先点左边的一个词句。';
                        return;
                    }
                    if (done.has(+d.dataset.k) && done.has(selL)) return;
                    if (+d.dataset.k === selL) {
                        done.add(selL);
                        mL.querySelector(`[data-k="${selL}"]`).classList.add('done');
                        d.classList.add('done');
                        selL = null;
                        document.getElementById('fb').className = 'feedback ok';
                        document.getElementById('fb').textContent = `已匹配 ${done.size}/6`;
                        if (done.size === 6) {
                            document.getElementById('fb').textContent = '六组全部匹配正确！“人间正道是沧桑”！';
                            passLevel('《七律·人民解放军占领南京》通关');
                        }
                    } else {
                        d.classList.add('sel');
                        setTimeout(() => d.classList.remove('sel'), 600);
                        document.getElementById('fb').className = 'feedback bad';
                        document.getElementById('fb').textContent = '不匹配，再试试。';
                    }
                };
                mR.appendChild(d);
            });
            document.getElementById('hp').onclick = () => {
                for (let i = 0; i < 6; i++) {
                    if (!done.has(i)) {
                        const l = mL.querySelector(`[data-k="${i}"]`),
                            r = mR.querySelector(`[data-k="${i}"]`);
                        l.classList.add('gold');
                        r.classList.add('gold');
                        document.getElementById('fb').className = 'feedback';
                        document.getElementById('fb').textContent = `提示：「${left[i]}」应配右边闪烁的那一条。`;
                        setTimeout(() => { l.classList.remove('gold');
                            r.classList.remove('gold'); }, 2200);
                        return;
                    }
                }
            };
        }

        /* ---------- 第9关 贺新郎·读史 ---------- */
        function setupDs(body) {
            const data = POEM.ds;
            const cands = ['人猿相揖', '石头磨过', '几千寒热', '五帝三皇', '风流人物', '陈王奋起'];
            const opts = [
                { t: 'A.“歌未竟”意为诗歌尚未唱完，暗喻人民革命的事业还在继续。', a: true },
                { t: 'B.“东方白”写天已破晓，一语双关，暗喻光明与希望正在到来。', a: true },
                { t: 'C.“东方白”与李贺“雄鸡一声天下白”意境相通，都表达了曙光降临的欣喜。', a: true },
                { t: 'D.   这两句词描写的是夕阳西沉、黄昏将至的凄凉景象。', a: false }
            ];
            let html = `<div class="card"><h3>${data.title} <span style="font-size:14px;color:#8a6d1f;">（${data.year}）</span></h3>
           <div class="bg-note">${data.bg}</div>
           <div class="poetry">${data.text}</div></div>
           <div class="card"><h3>哪个四字词曾在《沁园春·雪》中出现过？</h3>
           <div style="text-align:center;margin:12px 0;">` +
                cands.map(c =>
                    `<button class="btn small ghost cw" data-c="${c}" style="color:#7c0d11;border-color:#a11217;margin:6px;">${c}</button>`
                    ).join('') +
                `</div><div class="feedback" id="fb1"></div>
           <div id="task2" style="display:none;"><h3 style="margin-top:22px;">以下对“歌未竟，东方白”的赏析，正确的选项包括：（多选）</h3><div id="ms"></div>
           <div style="text-align:center;margin-top:10px;"><button class="btn small" id="msck">提 交</button></div></div>
           <div class="feedback" id="fb2"></div></div>`;
            body.innerHTML = html;
            let t1ok = false;
            body.querySelectorAll('.cw').forEach(b => b.onclick = () => {
                if (b.dataset.c === '风流人物') {
                    t1ok = true;
                    b.style.background = '#3d8b2e';
                    b.style.color = '#fff';
                    b.style.borderColor = '#3d8b2e';
                    document.getElementById('fb1').className = 'feedback ok';
                    document.getElementById('fb1').textContent = '对！“数风流人物，还看今朝”与“有多少风流人物”遥相呼应。';
                    document.getElementById('task2').style.display = 'block';
                } else {
                    b.style.background = '#b01f24';
                    b.style.color = '#fff';
                    setTimeout(() => { b.style.background = '';
                        b.style.color = '#7c0d11'; }, 700);
                    document.getElementById('fb1').className = 'feedback bad';
                    document.getElementById('fb1').textContent = '不是这个词，再想想《沁园春·雪》的结句。';
                }
            });
            const ms = document.getElementById('ms');
            opts.forEach((o, i) => {
                const b = document.createElement('button');
                b.className = 'qopt';
                b.dataset.a = o.a ? 1 : 0;
                b.innerHTML = `<input type="checkbox" style="margin-right:10px;transform:scale(1.3);">${o.t}`;
                b.onclick = () => {
                    const c = b.querySelector('input');
                    c.checked = !c.checked;
                    b.classList.toggle('sel', c.checked);
                };
                ms.appendChild(b);
            });
            document.getElementById('msck').onclick = () => {
                let ok = true;
                ms.querySelectorAll('.qopt').forEach(b => {
                    const c = b.querySelector('input').checked;
                    b.classList.remove('right', 'wrong');
                    if (c && (b.dataset.a === '1')) b.classList.add('right');
                    else if (!c && (b.dataset.a === '0')) b.classList.add('right');
                    else { b.classList.add('wrong');
                        ok = false; }
                });
                if (ok && t1ok) {
                    document.getElementById('fb2').className = 'feedback ok';
                    document.getElementById('fb2').textContent = '全部正确！“歌未竟，东方白”——飞越九关！';
                    passLevel('《贺新郎·读史》通关 · 全部关卡完成');
                } else {
                    document.getElementById('fb2').className = 'feedback bad';
                    document.getElementById('fb2').textContent = ok ? '' : '多选题有误：应选 3 项，排除描写“夕阳凄凉”的选项。';
                }
            };
        }

        /* ================= 音乐控制 ================= */
        let musicOn = false;
        const bgmEl = document.getElementById('bgm'),
            mb = document.getElementById('musicBtn');

        function stopMusic() { musicOn = false;
            bgmEl.pause();
            mb.textContent = '♪ 播放背景音乐'; }
        mb.onclick = () => {
            if (musicOn) { stopMusic(); } else {
                musicOn = true;
                bgmEl.play().catch(() => {});
                mb.textContent = '♪ 停止背景音乐';
            }
        };
    </script>
</body>
</html>
